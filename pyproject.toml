[project]
name = "signalpost-agent"
version = "0.1.0"
description = "Evidence-first research agent for Norwegian companies (Builderr Signalpost)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27,<0.28",
  "lxml>=5.3,<7",
  "pydantic>=2.10,<3",
]

[project.scripts]
signalpost = "signalpost.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
